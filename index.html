<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西游取经图 · 九九八十一难</title>
<style>
:root {
  --parchment: #f7f0db;
  --ink: #3c2415;
  --gold: #b8943c;
  --cinnabar: #c23a2b;
  --paper: #faf6eb;
  --border: #d4c5a0;
  --danger-1: #5b8c5a;
  --danger-2: #8b9c3a;
  --danger-3: #d4a030;
  --danger-4: #e07b30;
  --danger-5: #c23a2b;
  --panel-w: 420px;
  --bar-h: 5px;
  --map-h: 100vh;
  --map-w: 5000px;  /* 超宽地图 */
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Serif SC', 'Source Han Serif SC', 'STSong', 'KaiTi', serif;
  background: var(--parchment);
  color: var(--ink);
  overflow: hidden;  /* 禁止纵向滚动 */
  height: 100vh;
}

/* ===== 进度条 ===== */
#progress-wrap {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  height: var(--bar-h);
  background: rgba(184,148,60,0.15);
}
#progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--gold), var(--cinnabar));
  transition: width 0.15s linear;
}
#progress-num {
  position: fixed; top: 10px; right: 20px; z-index: 1001;
  font-size: 13px; color: var(--ink); opacity: 0.55;
}

/* ===== 地图容器 — 横向滚动 ===== */
#map-viewport {
  position: fixed; inset: 0;
  overflow-x: auto; overflow-y: hidden;
  scroll-behavior: smooth;
  cursor: grab;
  /* 隐藏滚动条但可滚动 */
  scrollbar-width: thin;
  scrollbar-color: var(--gold) transparent;
}
#map-viewport::-webkit-scrollbar { height: 6px; }
#map-viewport::-webkit-scrollbar-track { background: transparent; }
#map-viewport::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }
#map-viewport:active { cursor: grabbing; }

#map-content {
  height: 100vh; width: var(--map-w);
  position: relative;
}
#map-content svg {
  width: 100%; height: 100%;
  display: block;
}

/* ===== 节点 ===== */
.click-node { pointer-events: auto; cursor: pointer; }

.node-ring {
  fill: var(--paper); stroke-width: 3;
  transition: all 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.node-ring:hover { r: 14; stroke-width: 4; }
.node-ring.passed { fill: var(--gold); }

.node-number {
  font-size: 5px; fill: var(--ink); text-anchor: middle;
  dominant-baseline: central; pointer-events: none; font-weight: bold;
}
.node-label {
  font-size: 11px; fill: var(--ink); text-anchor: middle;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.click-node:hover .node-label { opacity: 1; }

/* 路线 */
.route-bg {
  fill: none; stroke: rgba(184,148,60,0.18); stroke-width: 3.5;
  stroke-linecap: round;
}
.route-fg {
  fill: none; stroke: var(--cinnabar); stroke-width: 4;
  stroke-linecap: round;
  filter: drop-shadow(0 0 6px rgba(194,58,43,0.4));
}

/* ===== 左侧详情面板 ===== */
#panel {
  position: fixed; top: 0; left: -460px;
  width: var(--panel-w); height: 100vh;
  background: var(--paper);
  border-right: 3px solid var(--gold);
  box-shadow: 4px 0 30px rgba(60,36,21,0.15);
  z-index: 500;
  overflow-y: auto;
  transition: left 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
}
#panel.open { left: 0; }
#panel-inner { padding: 30px 26px; }
#panel .close {
  position: sticky; top: 14px; float: right;
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--paper);
  font-size: 17px; cursor: pointer; color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  z-index: 10;
}
#panel .close:hover { background: var(--cinnabar); color: #fff; border-color: var(--cinnabar); }

.panel-trib { font-size: 13px; color: var(--gold); margin-bottom: 4px; }
.panel-name { font-size: 26px; color: var(--cinnabar); font-weight: bold; margin-bottom: 10px; }
.panel-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; font-size: 13px; color: var(--ink); opacity: 0.6; }

.danger-tag {
  display: inline-block; padding: 3px 10px; border-radius: 3px;
  font-size: 12px; font-weight: bold;
}
.dg-1 { background: var(--danger-1); color: #fff; }
.dg-2 { background: var(--danger-2); color: #fff; }
.dg-3 { background: var(--danger-3); color: #fff; }
.dg-4 { background: var(--danger-4); color: #fff; }
.dg-5 { background: var(--danger-5); color: #fff; }

.demon-block {
  background: var(--parchment);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 16px; margin-bottom: 12px;
}
.demon-block h4 { font-size: 17px; color: var(--cinnabar); margin-bottom: 8px; }
.demon-block .desc { font-size: 14px; line-height: 1.7; opacity: 0.8; margin-bottom: 10px; }
.demon-block img {
  width: 100%; aspect-ratio: 1; object-fit: cover;
  border-radius: 4px; border: 2px solid var(--border);
  background: #e8dcc8;
}
.img-placeholder {
  width: 100%; aspect-ratio: 1; border-radius: 4px;
  border: 2px dashed var(--border); background: #e8dcc8;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--ink); opacity: 0.4;
}

.events-section { margin-top: 14px; }
.events-section h4 { font-size: 15px; color: var(--ink); margin-bottom: 8px; }
.events-section li {
  position: relative; padding-left: 18px; margin-bottom: 4px;
  font-size: 14px; line-height: 1.6; list-style: none;
}
.events-section li::before {
  content: '◇'; position: absolute; left: 0; top: 1px;
  color: var(--gold); font-size: 9px;
}

#overlay {
  position: fixed; inset: 0; background: rgba(60,36,21,0.2);
  z-index: 499; opacity: 0; pointer-events: none;
  transition: opacity 0.35s;
}
#overlay.on { opacity: 1; pointer-events: auto; }

/* ===== 提示 ===== */
#hint {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  font-size: 13px; color: var(--gold); opacity: 0.5;
  z-index: 50; pointer-events: none;
  animation: fadeHint 3s ease-in-out infinite;
}
@keyframes fadeHint {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.7; }
}

@media (max-width: 640px) {
  :root { --panel-w: 100vw; }
}
</style>
</head>
<body>

<!-- 进度条 -->
<div id="progress-wrap"><div id="progress-fill"></div></div>
<div id="progress-num">0 / 81 难</div>

<!-- 横向滚动地图 -->
<div id="map-viewport">
  <div id="map-content">
    <svg id="map-svg" viewBox="0 0 5000 950"></svg>
  </div>
</div>

<!-- 滚动提示 -->
<div id="hint">↔ 滚动鼠标浏览取经之路</div>

<!-- 遮罩 -->
<div id="overlay" onclick="closePanel()"></div>

<!-- 详情面板 -->
<div id="panel">
  <div id="panel-inner">
    <button class="close" onclick="closePanel()">✕</button>
    <div class="panel-trib" id="p-num"></div>
    <div class="panel-name" id="p-name"></div>
    <div class="panel-meta">
      <span id="p-danger"></span>
      <span>📍 <span id="p-loc"></span></span>
      <span>📖 <span id="p-ch"></span></span>
    </div>
    <div id="p-demons"></div>
    <div class="events-section">
      <h4>📜 事件经过</h4>
      <ul id="p-events"></ul>
    </div>
  </div>
</div>

<script>
const DANGER_NAMES = {1:'安全',2:'小险',3:'中等',4:'凶险',5:'九死一生'};
const DANGER_CLRS = {1:'#5b8c5a',2:'#8b9c3a',3:'#d4a030',4:'#e07b30',5:'#c23a2b'};
const MAP_W = 5000, MAP_H = 950;
const NODE_SPACING = 52; // 每难之间的水平间距(px)

let TRIB = [];
let totalPathLen = 0;
let nodePositions = []; // {x, y, id} — 节点在SVG中的坐标

// ============================================================
async function init() {
  const num = document.getElementById('progress-num');
  try {
    const r = await fetch('tribulations.json', {cache: 'no-cache'});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    TRIB = await r.json();
    if (!Array.isArray(TRIB) || TRIB.length === 0) throw new Error('数据为空');
    buildMap();
    bindScroll();
  } catch (err) {
    console.error('加载失败:', err);
    num.textContent = '❌ 加载失败';
    num.style.color = 'var(--cinnabar)';
    num.style.opacity = '1';
    document.getElementById('hint').innerHTML =
      '加载 tribulations.json 失败。<br>请通过 HTTP server 访问（如 <code>python3 -m http.server</code>），file:// 协议无法 fetch。';
    document.getElementById('hint').style.opacity = '1';
    document.getElementById('hint').style.animation = 'none';
  }
}

// ============================================================
function buildMap() {
  const svg = document.getElementById('map-svg');
  const NS = 'http://www.w3.org/2000/svg';

  // --- 背景 ---
  svg.appendChild(el('rect', {x:0,y:0,w:MAP_W,h:MAP_H,fill:'#f7f0db'}));

  // 装饰性山水轮廓
  const mountains = el('g', {opacity:0.06,fill:'#3c2415'});
  for (let i = 0; i < 20; i++) {
    const mx = 100 + i * 250 + Math.random() * 100;
    const mh = 60 + Math.random() * 140;
    mountains.appendChild(el('path', {d:`M${mx},${420+Math.random()*200} l30,-${mh} l30,${mh*0.4} l40,-${mh*0.8} l30,${mh*0.3} l30,-${mh*0.5} l20,${mh*0.3} l30,-${mh*0.6} l25,${mh*0.4}z`}));
  }
  svg.appendChild(mountains);

  // 装饰云纹
  const clouds = el('g', {opacity:0.05,fill:'#b8943c'});
  for (let i = 0; i < 12; i++) {
    const cx = 150 + i * 400, cy = 100 + Math.sin(i*1.7)*150;
    clouds.appendChild(el('circle', {cx,cy,r:35}));
    clouds.appendChild(el('circle', {cx:cx+35,cy:cy-10,r:28}));
    clouds.appendChild(el('circle', {cx:cx-20,cy:cy-15,r:22}));
  }
  svg.appendChild(clouds);

  // --- 标题 ---
  svg.appendChild(el('text', {x:MAP_W/2,y:55,'text-anchor':'middle',fill:'#6b2f1a','font-size':30,'font-weight':'bold'}, '西 游 取 经 图'));
  svg.appendChild(el('text', {x:MAP_W/2,y:80,'text-anchor':'middle',fill:'#8b6914','font-size':13}, '唐三藏西天拜佛求经 · 九九八十一难'));

  // --- 地标 ---
  const landmarks = [
    {x:250, y:340, t:'长安', sub:'起点 · 贞观十三年'},
    {x:700, y:390, t:'两界山', sub:'收孙悟空'},
    {x:1250, y:450, t:'高老庄', sub:'收猪八戒'},
    {x:1800, y:400, t:'流沙河', sub:'收沙悟净'},
    {x:2500, y:300, t:'火焰山', sub:'三调芭蕉扇'},
    {x:3200, y:380, t:'通天河', sub:'遇老鼋'},
    {x:3900, y:290, t:'狮驼岭', sub:'三魔王'},
    {x:4550, y:350, t:'天竺灵山', sub:'终点 · 取真经'},
  ];
  landmarks.forEach(l => {
    svg.appendChild(el('text', {x:l.x,y:l.y,'text-anchor':'middle',fill:'#8b6914','font-size':13,'font-weight':'bold'}, l.t));
    svg.appendChild(el('text', {x:l.x,y:l.y+18,'text-anchor':'middle',fill:'#aaa','font-size':10}, l.sub));
  });

  // --- 计算节点坐标 ---
  // 路线: 长安(左) → 天竺(右), 从左到右
  const startX = 200, endX = 4600;
  nodePositions = TRIB.map((t, i) => {
    const p = i / 80;
    const x = startX + p * (endX - startX);  // 左→右
    const y = 340 + Math.sin(p * Math.PI * 5) * 130 + Math.cos(p * Math.PI * 2.7) * 70 + Math.sin(p * Math.PI * 1.5) * 80;
    return {x, y, id: t.id, name: t.name, danger: t.dangerLevel};
  });

  // --- 构建路径 ---
  let d = `M ${nodePositions[0].x} ${nodePositions[0].y}`;
  for (let i = 1; i < nodePositions.length; i++) {
    const a = nodePositions[i-1], b = nodePositions[i];
    const dx = b.x - a.x, dy = b.y - a.y;
    d += ` C ${a.x+dx*0.35} ${a.y+dy*0.15}, ${a.x+dx*0.65} ${b.y-dy*0.15}, ${b.x} ${b.y}`;
  }

  // 路径
  svg.appendChild(el('path', {d,class:'route-bg'}));
  const routeFg = el('path', {d,class:'route-fg',id:'route-fg'});
  svg.appendChild(routeFg);

  // 计算总长度
  const tmp = document.createElementNS(NS,'path');
  tmp.setAttribute('d', d);
  svg.appendChild(tmp);
  totalPathLen = tmp.getTotalLength();
  svg.removeChild(tmp);
  routeFg.style.strokeDasharray = totalPathLen;
  routeFg.style.strokeDashoffset = totalPathLen;

  // --- 渲染节点 ---
  const nodesLayer = el('g', {});
  nodePositions.forEach((pt, i) => {
    const t = TRIB[i];
    const g = el('g', {class:'click-node',transform:`translate(${pt.x},${pt.y})`});
    g.addEventListener('click', (e) => { e.stopPropagation(); openPanel(i); });

    // 高危光环
    if (t.dangerLevel >= 4) {
      g.appendChild(el('circle', {r:17,fill:'none',stroke:DANGER_CLRS[t.dangerLevel],'stroke-width':1.5,opacity:0.35}));
    }

    // 节点圆
    g.appendChild(el('circle', {r:9,class:'node-ring',id:`node-${i}`,stroke:DANGER_CLRS[t.dangerLevel]}));

    // 编号(前10个, 以及每5的倍数)
    if (i < 10 || i % 5 === 0) {
      g.appendChild(el('text', {class:'node-number'}, t.id));
    }

    // 悬停标签
    g.appendChild(el('text', {y:20,class:'node-label'}, `${t.id}. ${t.name}`));

    nodesLayer.appendChild(g);
  });
  svg.appendChild(nodesLayer);
}

function el(tag, attrs, text) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (k === 'class') e.setAttribute('class', v);
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v);
  }
  if (text) e.textContent = text;
  return e;
}

// ============================================================
// 横向滚动驱动进度
// ============================================================
function bindScroll() {
  const vp = document.getElementById('map-viewport');
  const bar = document.getElementById('progress-fill');
  const num = document.getElementById('progress-num');
  const route = document.getElementById('route-fg');

  // 鼠标滚轮 → 横向滚动
  vp.addEventListener('wheel', (e) => {
    e.preventDefault();
    vp.scrollLeft += e.deltaY * 2;  // 纵向滚轮转为横向
  }, {passive:false});

  let ticking = false;
  const update = () => {
    const maxScroll = vp.scrollWidth - vp.clientWidth;
    const pct = maxScroll > 0 ? Math.min(vp.scrollLeft / maxScroll, 1) : 0;

    bar.style.width = `${pct * 100}%`;
    const done = Math.min(Math.floor(pct * 81), 81);
    num.textContent = `${done} / 81 难`;

    if (totalPathLen > 0) {
      route.style.strokeDashoffset = totalPathLen * (1 - pct);
    }

    // 高亮节点
    document.querySelectorAll('.node-ring').forEach(c => {
      const id = parseInt(c.id.replace('node-',''));
      c.classList.toggle('passed', id < done);
    });

    ticking = false;
  };

  vp.addEventListener('scroll', () => {
    if (!ticking) { requestAnimationFrame(update); ticking = true; }
  }, {passive:true});

  update();
}

// ============================================================
// 面板
// ============================================================
function openPanel(idx) {
  const t = TRIB[idx];
  if (!t) return;

  // 滚动地图使节点位于视图中央
  const vp = document.getElementById('map-viewport');
  const pt = nodePositions[idx];
  const targetX = pt.x - vp.clientWidth / 2;
  vp.scrollTo({left: Math.max(0, targetX), behavior: 'smooth'});

  document.getElementById('p-num').textContent = `第 ${t.id} 难 · 九九八十一难`;
  document.getElementById('p-name').textContent = t.name;
  document.getElementById('p-loc').textContent = t.location;
  document.getElementById('p-ch').textContent = t.chapterRef;
  document.getElementById('p-danger').innerHTML =
    `<span class="danger-tag dg-${t.dangerLevel}">${DANGER_NAMES[t.dangerLevel]}</span>`;

  document.getElementById('p-demons').innerHTML = t.demons.map(d => {
    const fn = d.name.replace(/[/、]/g, '-');
    const noImg = d.name === '无' || d.name === '待考证' || d.name.includes('(非妖怪)') || d.name.includes('(人)') || d.name.includes('(天庭)');
    const imgHtml = noImg ? '' : `
      <img src="illustrations/${fn}.png" alt="${d.name}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
      <div class="img-placeholder" style="display:none">🎨 插画生成中...</div>`;
    return `<div class="demon-block">
      <h4>${noImg ? '📜' : '👹'} ${d.name}</h4>
      <div class="desc">${d.description}</div>
      ${imgHtml}
    </div>`;
  }).join('');

  document.getElementById('p-events').innerHTML = t.events.map(e => `<li>${e}</li>`).join('');

  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('on');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('on');
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closePanel(); });

// ============================================================
init();
</script>
</body>
</html>
